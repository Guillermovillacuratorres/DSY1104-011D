<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Web con js</title>
</head>

<body>

    <header></header>


    <main>
        <section id="formulario">
            <div class="container">
                <h2 onmousemove="(mouseEvent())">Datos personales</h2>

                <form action="#">
                    <div class="row">

                        <div class="col-6 mt-3">
                            <div class="contenedor-input">
                                <label for="txtNombre">Nombre:</label>
                                <input id="txtNombre" class="form-control" type="text" placeholder="Ingrese su nombre">
                            </div>
                        </div>


                        <div class="col-6 mt-3">
                            <div class="contenedor-input">
                                <label for="txtApellido">Apellido:</label>
                                <input onkeypress="cambioInput()" id="txtApellido" class="form-control" type="text"
                                    placeholder="Ingrese su apellido">
                            </div>
                        </div>


                        <div class="col-2 mt-3">
                            <div class="contenedor-input">
                                <label for="txtEdad">Edad:</label>
                                <input id="txtEdad" class="form-control" type="number" placeholder="Ingrese su edad">
                            </div>
                        </div>



                        <div class="col-10 mt-3">
                            <div class="contenedor-input">
                                <label for="txtDireccion">Drirección:</label>
                                <input id="txtDireccion" class="form-control" type="text"
                                    placeholder="Ingrese su dirección">
                            </div>
                        </div>


                        <div class="col-12 contenedor-btn">
                            <button onclick="guardar()" class="btn btn-primary">Guardar</button>
                        </div>

                    </div>
                </form>


                <div class="contenedor-info">

                    <div class="contenedor-label">
                        <label for="">Nombre:</label>
                        <label id="lblNombre" for=""></label>
                    </div>

                    <div class="contenedor-label">
                        <label for="">Apellido:</label>
                        <label id="lblApellido" for=""></label>
                    </div>

                    <div class="contenedor-label">
                        <label for="">Dirección:</label>
                        <label id="lblDireccion" for=""></label>
                    </div>

                    <div class="contenedor-label">
                        <label for="">Edad:</label>
                        <label id="lblEdad" for=""></label>
                    </div>

                </div>

            </div>
        </section>
    </main>


    <footer></footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="function.js"></script>
</body>

</html>
